services:
  - type: web
    name: pinkearn-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Secrets: fill these in the Render dashboard (sync: false = not stored in git)
      - key: MONGODB_URI
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: ADSGRAM_BLOCK_ID
        sync: false
      - key: ADSGRAM_REWARD_SECRET
        sync: false
